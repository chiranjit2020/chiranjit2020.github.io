<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a4a3c" />
  <meta name="description" content="Chiranjit Karmakar — Fullstack Developer & Founder of CODEWORM" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
  <link rel="mask-icon" href="./images/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#D65A31">
  <title>Coming Soon — Chiranjit Karmakar - Designer, Front-end & Backend Developer, Founder of CODEWORM</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CK" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oranienbaum&display=swap" rel="stylesheet" />

  <style>
    :root {
      --background: #0a4a3c;
      --foreground: #f2b759;
      --muted: #a3a094;
      --border: rgba(242, 183, 89, 0.22);
    }

    *, *::after, *::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      background: var(--background);
      color: var(--foreground);

      padding: 2rem 1.25rem;
      overflow-x: hidden;

      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .coming-soon {
      width: min(90%, 640px);
      max-width: 100%;
      text-align: center;
    }

    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 2.5rem;
      border-radius: 20px;
      display: block;
    }

    h1 {
      font-family: 'Oranienbaum', 'Manrope', serif;
      font-weight: 400;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }

    .message {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      line-height: 1.7;
      margin-bottom: 3rem;
    }

    .status {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--foreground);
      margin-bottom: 3.5rem;
    }

    .social {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .social a {
      color: var(--foreground);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 150ms ease;
    }

    .social a:hover {
      border-bottom-color: var(--foreground);
    }

    footer {
      color: var(--muted);
      font-size: 0.75rem;
    }

    @media (max-width: 480px) {
      .mark {
        width: 72px;
        height: 72px;
        margin-bottom: 2rem;
      }

      .status {
        margin-bottom: 2.5rem;
      }

      .social {
        gap: 1rem;
        margin-bottom: 3rem;
      }
    }
  </style>
</head>

<body>

  <main class="coming-soon">

    <img class="mark" src="./images/ck-new-logo6.png" alt="CODEWORM" />

    <h1>Something is coming.</h1>

    <p class="message">
      A new portfolio — cleaner, more intentional, built from scratch.
    </p>

    <p class="status">Launching soon</p>

    <nav class="social" aria-label="Social links">
      <a href="https://github.com/chiranjit2020" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/chiranjit-karmakar-6b8639203" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:info@chiranjitkarmakar.com">Email</a>
    </nav>

    <footer>
      © 2026 Chiranjit Karmakar · CODEWORM
    </footer>

  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

</body>
</html>
