<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Chiranjit Karmakar — Fullstack Developer & Founder of CODEWORM" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
  <link rel="manifest" href="./images/site.webmanifest">
  <link rel="mask-icon" href="./images/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#D65A31">
  <title>Coming Soon — Chiranjit Karmakar - Designer, Front-end & Backend Developer, Founder of CODEWORM</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --background: #050708;
      --foreground: #f5f5f5;
      --muted: #8b9198;
      --accent: #00d084;
      --border: #25292c;
    }

    *, *::after, *::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* accounts for mobile browser chrome */

      display: grid;
      place-items: center;

      background: var(--background);
      color: var(--foreground);

      padding: 2rem 1.25rem;
      overflow-x: hidden;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .coming-soon {
      width: min(90%, 720px);
      max-width: 100%;
      text-align: center;
    }

    /* Terminal mark */

    .terminal-mark {
      position: relative;

      width: 116px;
      height: 116px;

      margin: 0 auto 4rem;

      display: grid;
      place-items: center;

      border-radius: 16px;
      background: var(--background);

      color: var(--accent);

      font-family: monospace;
      font-size: 3rem;
    }

    /* Diagonal gradient border: bright at top-left and bottom-right,
       fading to transparent through the middle of the frame */
    .terminal-mark::before {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: 16px;
      padding: 2px;

      background: linear-gradient(
        135deg,
        var(--accent) 0%,
        rgba(0, 208, 132, 0.35) 18%,
        transparent 40%,
        transparent 60%,
        rgba(0, 208, 132, 0.35) 82%,
        var(--accent) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      pointer-events: none;
    }

    /* Corner glow bloom, offset toward top-left and bottom-right */
    .terminal-mark::after {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: 16px;

      box-shadow:
        -10px -10px 28px rgba(0, 208, 132, 0.32),
        10px 10px 28px rgba(0, 208, 132, 0.32),
        0 0 34px rgba(0, 208, 132, 0.1);

      pointer-events: none;
    }

    .terminal-mark span {
      position: relative;
      z-index: 1;
      transform: translateY(-3px);
    }

    /* Heading */

    h1 {
      font-family: monospace;
      font-size: clamp(1.9rem, 7vw, 4rem);
      font-weight: 400;
      letter-spacing: -0.05em;

      margin-bottom: 1.5rem;
    }

    h1 span {
      color: var(--accent);
    }

    /* Description */

    .message {
      color: var(--muted);

      font-family: monospace;
      font-size: clamp(0.85rem, 2.6vw, 1.1rem);
      line-height: 1.8;

      margin-bottom: 3.5rem;
    }

    /* Progress */

    .progress {
      width: min(100%, 440px);
      margin: 0 auto 3.5rem;
    }

    .progress-track {
      height: 4px;

      overflow: hidden;

      background: var(--border);
      border-radius: 999px;
    }

    .progress-value {
      width: 25%;
      height: 100%;

      background: var(--accent);
    }

    .progress-label {
      margin-top: 0.8rem;

      color: var(--accent);

      font-family: monospace;
      font-size: 0.9rem;
    }

    /* Status */

    .status {
      color: var(--muted);

      font-family: monospace;
      font-size: clamp(0.95rem, 3vw, 1.15rem);

      margin-bottom: 4rem;
    }

    .cursor {
      display: inline-block;

      width: 12px;
      height: 24px;

      margin-left: 4px;

      vertical-align: middle;

      background: var(--accent);
    }

    /* Links */

    .social {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;

      margin-bottom: 5rem;
    }

    .social a {
      color: var(--muted);

      text-decoration: none;

      font-family: monospace;
      font-size: clamp(0.85rem, 2.6vw, 1rem);

      transition: color 150ms ease;
    }

    .social a:hover {
      color: var(--accent);
    }

    .separator {
      color: var(--accent);
    }

    /* Footer */

    footer {
      color: #454b50;

      font-family: monospace;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .terminal-mark {
        width: 90px;
        height: 90px;

        margin-bottom: 2.5rem;

        font-size: 2.3rem;
      }

      h1 {
        font-size: 2rem;
      }

      .status {
        margin-bottom: 3rem;
      }

      .social {
        margin-bottom: 3rem;
      }
    }

    /* Tight phones down to 320px */
    @media (max-width: 380px) {
      body {
        padding: 1.5rem 1rem;
      }

      .terminal-mark {
        width: 76px;
        height: 76px;

        margin-bottom: 2rem;

        font-size: 1.9rem;
      }

      .terminal-mark::before {
        padding: 1.5px;
      }

      h1 {
        margin-bottom: 1.1rem;
        letter-spacing: -0.03em;
      }

      .message {
        margin-bottom: 2.25rem;
        line-height: 1.6;
      }

      .progress {
        margin-bottom: 2.25rem;
      }

      .status {
        margin-bottom: 2.25rem;
      }

      .social {
        gap: 0.85rem;
        margin-bottom: 3rem;
      }

      footer {
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

  <main class="coming-soon">

    <div class="terminal-mark" aria-hidden="true">
      <span>&gt;_</span>
    </div>

    <h1>
      Something <span>is coming.</span>
    </h1>

    <p class="message">
      I'm crafting a new experience.<br>
      Better. Cleaner. Purposeful.
    </p>

    <div class="progress" aria-label="25 percent complete">
      <div class="progress-track">
        <div class="progress-value"></div>
      </div>

      <div class="progress-label">
        25%
      </div>
    </div>

    <p class="status">
      Launching Soon.<span class="cursor"></span>
    </p>

    <nav class="social" aria-label="Social links">
      <a href="#" aria-label="GitHub">GitHub</a>
      <span class="separator">•</span>

      <a href="#" aria-label="LinkedIn">LinkedIn</a>
      <span class="separator">•</span>

      <a href="mailto:info@chiranjitkarmakar.com" aria-label="Email">Email</a>
    </nav>

    <footer>
      © 2026 Chiranjit Karmakar
    </footer>

  </main>

</body>
</html>
